<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HS Birthday Poster Maker</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px 16px; font-family: Arial, sans-serif; color: #142c4c; background: #f5f2ed; }
    main { max-width: 1050px; margin: auto; }
    h1 { text-align: center; margin: 0 0 8px; font-family: Georgia, serif; font-size: clamp(28px, 4vw, 44px); }
    .intro { text-align: center; color: #697b92; margin: 0 0 28px; }
    .layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 22px; align-items: start; }
    .panel { background: #fffdfa; border: 1px solid #e9e1d7; border-radius: 16px; padding: 20px; }
    label { display: block; font-weight: bold; font-size: 14px; margin: 15px 0 7px; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd8d0; border-radius: 9px; font-size: 16px; }
    button { width: 100%; margin-top: 20px; padding: 15px 12px; border: 0; border-radius: 9px; background: #153356; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 36px; margin: 12px 0 0; font-size: 13px; line-height: 1.45; color: #4c6078; overflow-wrap: anywhere; }
    .preview-wrap { text-align: center; background: #f3f0eb; border-radius: 12px; padding: 14px; }
    #poster { display: block; width: 100%; max-width: 620px; height: auto; margin: auto; }
    .hint { font-size: 13px; color: #6d7b8d; line-height: 1.5; }
    @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } .panel { padding: 16px; } }
  </style>
</head>
<body>
<main>
  <h1>A birthday wish, made personal.</h1>
  <p class="intro">Enter a name and download your personalised birthday poster.</p>
  <div class="layout">
    <section class="panel">
      <h3>Personalise your poster</h3>
      <p class="hint">Both fields are optional. The name appears directly over the central HS logo. No box or extra background is added.</p>
      <label for="firstName">First name</label>
      <input id="firstName" type="text" placeholder="First name" autocomplete="off">
      <label for="lastName">Last name</label>
      <input id="lastName" type="text" placeholder="Last name" autocomplete="off">
      <button id="downloadBtn" type="button">⬇ Download birthday poster</button>
      <p id="status" role="status">Loading poster…</p>
    </section>
    <section class="panel">
      <h3>Live preview</h3>
      <div class="preview-wrap"><canvas id="poster" aria-label="Birthday poster preview"></canvas></div>
    </section>
  </div>
</main>
<script>
(() => {
  const first = document.getElementById('firstName');
  const last = document.getElementById('lastName');
  const btn = document.getElementById('downloadBtn');
  const status = document.getElementById('status');
  const canvas = document.getElementById('poster');
  const ctx = canvas.getContext('2d');
  const img = new Image();
  let ready = false;
  let renderTimer;

  function setStatus(message, error = false) {
    status.textContent = message;
    status.style.color = error ? '#b42318' : '#4c6078';
  }

  function render() {
    if (!ready) return;
    const w = img.naturalWidth;
    const h = img.naturalHeight;
    canvas.width = w;
    canvas.height = h;
    ctx.drawImage(img, 0, 0, w, h);

    const name = [first.value.trim(), last.value.trim()].filter(Boolean).join(' ');
    if (name) {
      // Large name directly over the central HS symbol; no background rectangle.
      let size = Math.round(w * 0.104);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold ' + size + 'px Georgia, "Times New Roman", serif';
      while (ctx.measureText(name).width > w * 0.90 && size > 20) {
        size -= 2;
        ctx.font = 'bold ' + size + 'px Georgia, "Times New Roman", serif';
      }
      ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(255,255,255,0.78)';
      ctx.lineWidth = Math.max(2, w * 0.003);
      ctx.strokeText(name, w / 2, h * 0.375);
      ctx.fillStyle = '#102b4d';
      ctx.fillText(name, w / 2, h * 0.375);
    }
  }

  function updatePreview() {
    render();
    setStatus('Preview updated. Click download when ready.');
  }

  img.onload = () => {
    ready = true;
    render();
    btn.disabled = false;
    setStatus('Ready. Enter a name and click download.');
  };
  img.onerror = () => {
    btn.disabled = true;
    setStatus('Poster image could not load. Please re-extract the ZIP and open index.html again.', true);
  };

  btn.disabled = true;

  first.addEventListener('input', updatePreview);
  last.addEventListener('input', updatePreview);

  btn.addEventListener('click', () => {
    if (!ready) {
      setStatus('Please wait for the poster to load.', true);
      return;
    }
    try {
      render();
      canvas.toBlob((blob) => {
        if (!blob) {
          setStatus('Could not create PNG. Try Chrome or Edge.', true);
          return;
        }
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'birthday-poster.png';
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
        setStatus('Download started. Check your Downloads folder.');
      }, 'image/png');
    } catch (error) {
      setStatus('Download failed: ' + (error.message || 'browser error'), true);
    }
  });
})();
